<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a80045"/>
      <stop offset="1" stop-color="#5e0026"/>
    </linearGradient>
    <clipPath id="r"><rect width="32" height="32" rx="9"/></clipPath>
  </defs>
  <rect width="32" height="32" rx="9" fill="url(#g)"/>
  <g clip-path="url(#r)">
    <!-- checkered corner -->
    <g fill="#fff600">
      <rect x="24" y="24" width="4" height="4"/>
      <rect x="28" y="28" width="4" height="4"/>
    </g>
    <g fill="#000" opacity=".55">
      <rect x="28" y="24" width="4" height="4"/>
      <rect x="24" y="28" width="4" height="4"/>
    </g>
  </g>
  <!-- tyre -->
  <circle cx="15" cy="14.5" r="7.5" fill="none" stroke="#fff600" stroke-width="2.4"/>
  <circle cx="15" cy="14.5" r="2.6" fill="none" stroke="#fff600" stroke-width="2"/>
</svg>
